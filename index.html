<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusDirect - Réservations</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <a class="logo" href="index.html">BusDirect</a>
    <nav>
      <a class="active" href="index.html">Réservations</a>
      <a href="billets.html">Billets (<span id="ticket-count">0</span>)</a>
    </nav>
  </header>

  <main>
    <h1>Safi → Marrakech</h1>
    <p class="subtitle">Gestion des réservations du bus - 20 places</p>

    <section class="stats">
      <div class="stat">
        <strong id="available-count">20</strong>
        <span>Places libres</span>
      </div>
      <div class="stat">
        <strong id="occupied-count">0</strong>
        <span>Places occupées</span>
      </div>
      <div class="stat">
        <strong id="revenue-count">0 DH</strong>
        <span>Recette (80 DH par place)</span>
      </div>
    </section>

    <div class="layout">
      <section class="card">
        <h2>Plan du bus</h2>
        <p class="legend">
          <span class="free"></span> Libre
          <span class="taken"></span> Occupé
        </p>

        <div id="seat-grid" class="seat-grid"></div>

        <p class="help">
          Cliquez sur un siège libre pour le choisir, ou sur un siège occupé pour le modifier.
        </p>
      </section>
